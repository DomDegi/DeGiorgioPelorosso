name: Python CI/CD Pipeline

# 1. TRIGGERS
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. JOBS
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5   

    - name: Setup Python
      uses: actions/setup-python@v6 
      with:
        python-version: '3.10' 

    - name: Download dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_dev.txt

    - name: Execute pytest
      run: |
        python -m pytest
        
    - name: Build HTML Documentation
      run: |
        pdoc ./src -o ./docs/pdocs
  
  # CD JOB: Build and push the Docker image
  build-and-push-container:
    needs: test # the image only builds if tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR

    steps:
    - name: Checkout code
      uses: actions/checkout@v5 

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4 
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} # token automatically provided by GitHub

    - name: Convert owner to lowercase
      run: |
        echo "OWNER_LC=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@v6 
      with:
        # The context is the repository's root
        context: .
        file: docker/Dockerfile.prod
        push: true
        # env.OWNER_LC instead of github.repository_owner, the second could use uppercases causing error
        tags: ghcr.io/${{ env.OWNER_LC }}/astralog-hpc:latest
  
  # AUTONOMOUS DOCUMENTATION DEPLOYMENT
  deploy-docs:
    needs: test # Only deploy docs if the code passes its tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # Needed to push to GitHub Pages
      id-token: write   # Needed for secure deployment

    steps:
    - name: Checkout code
      uses: actions/checkout@v5 

    - name: Setup Python
      uses: actions/setup-python@v6 
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_dev.txt
        pip install pdoc>=16.0.0

    - name: Generate HTML Documentation
      run: |
        pdoc ./src ./tests -o ./_site               # Generate HTML docs for both src and tests, output to _site

        cp ./_site/src.html ./_site/index.html      # Adds a homepage to the generated docs
        
        cp -r uml _site/uml                         # Copy the UML folder into the generated site so images work

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './_site'

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
