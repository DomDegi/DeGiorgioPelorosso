name: Python CI/CD Pipeline

# 1. TRIGGERS
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. JOBS
jobs:
  # ==========================================
  # GATE 0: RELEASE COMMIT FILTER
  # Prevents the full CI/CD pipeline from re-running on the semantic
  # release version-bump commit (which only updates version numbers).
  # All subsequent jobs inherit this skip via their 'needs' chain.
  # ==========================================
  check-commit:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event.head_commit.message }}" == chore\(release\):* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

  # ==========================================
  # GATE 1: DEEP CODEQL SEMANTIC ANALYSIS
  # ==========================================
  codeql-analysis:
    name: CodeQL Security Scan
    needs: check-commit
    if: needs.check-commit.outputs.is_release == 'false'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ==========================================
  # GATE 2: UNIT TESTING, COVERAGE & DOCS
  # ==========================================
  test:
    needs: codeql-analysis # Waits for security scan to pass before running
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Download dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_dev.txt
        pip install black ruff pytest-cov # Added pytest-cov for coverage

    - name: Check Formatting & Linting
      run: |
        black --check src/ tests/
        ruff check src/ tests/

    - name: Execute pytest (with Coverage & JUnit XML)
      run: |
        python -m pytest --cov=src --cov-report=xml --junitxml=pytest-report.xml

    - name: Upload Pytest Report on Failure
      if: failure() # Only triggers if the pytest step fails!
      uses: actions/upload-artifact@v4
      with:
        name: pytest-failure-report
        path: pytest-report.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false # Does not block pipeline if upload fails
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Build HTML Documentation
      run: |
        pdoc ./src -o ./docs/pdocs

  # ==========================================
  # CD JOB: BUILD & PUSH DOCKER CONTAINER
  # ==========================================
  build-and-push-container:
    needs: test # The image only builds if tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub

    - name: Convert owner to lowercase
      run: |
        echo "OWNER_LC=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3 # Required for advanced Docker caching

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile.prod
        push: true
        tags: ghcr.io/${{ env.OWNER_LC }}/astralog-hpc:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max # Caches Docker layers via GitHub Actions cache

    - name: Validate Published Docker Image
      run: |
        echo "Spinning up the production container to verify internal integrity..."
        docker run --rm \
          --entrypoint python \
          -v ${{ github.workspace }}/tests:/workspace/tests \
          ghcr.io/${{ env.OWNER_LC }}/astralog-hpc:latest \
          -m pytest tests/

  # ==========================================
  # MIRROR TO CINECA GITLAB & AWAIT SIF BUILD
  # ==========================================
  mirror-to-gitlab:
    needs: [check-commit, test] # check-commit needed to access its output for the skip
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-commit.outputs.is_release == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Prevents GitHub from hanging forever if CINECA is down
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to CINECA GitLab
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.CINECA_GITLAB_TOKEN }}
        run: |
          git remote add gitlab https://oauth2:$GITLAB_TOKEN@gitlab.hpc.cineca.it/$GITLAB_USERNAME/DeGiorgioPelorosso-deploy.git
          git push gitlab --all --force
          git push gitlab --tags --force

      - name: Await GitLab Container Build (Apptainer)
        env:
          GITLAB_TOKEN: ${{ secrets.CINECA_GITLAB_TOKEN }}
          PROJECT_ID: "2955"
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Waiting for GitLab to register the pipeline for commit $COMMIT_SHA..."

          for i in {1..12}; do
            RESPONSE=$(curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "https://gitlab.hpc.cineca.it/api/v4/projects/$PROJECT_ID/pipelines?sha=$COMMIT_SHA")

            IS_ARRAY=$(echo "$RESPONSE" | jq 'type == "array"')

            if [ "$IS_ARRAY" != "true" ]; then
              echo "CINECA GitLab returned an error."
              exit 1
            fi

            PIPELINE_ID=$(echo "$RESPONSE" | jq -r '.[0].id // empty')

            if [ "$PIPELINE_ID" != "null" ] && [ -n "$PIPELINE_ID" ]; then
              echo "Found GitLab Pipeline ID: $PIPELINE_ID"
              break
            fi

            echo "Pipeline not found yet, retrying in 10 seconds..."
            sleep 10
          done

          if [ "$PIPELINE_ID" == "null" ] || [ -z "$PIPELINE_ID" ]; then
            echo "Error: Could not find GitLab pipeline for this commit."
            exit 1
          fi

          echo "Polling GitLab Pipeline Status..."
          while true; do
            STATUS=$(curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "https://gitlab.hpc.cineca.it/api/v4/projects/$PROJECT_ID/pipelines/$PIPELINE_ID" | jq -r '.status')

            if [ "$STATUS" == "success" ]; then
              echo "SUCCESS: GitLab successfully built and published the .sif container!"
              exit 0
            elif [ "$STATUS" == "failed" ] || [ "$STATUS" == "canceled" ]; then
              echo "ERROR: GitLab pipeline failed to build the container! Check CINECA GitLab logs."
              exit 1
            fi

            echo "Current status: $STATUS... waiting 15 seconds."
            sleep 15
          done

  # ==========================================
  # AUTOMATED SEMANTIC RELEASE
  # ==========================================
  release:
    name: Semantic Release
    needs: [check-commit, test, build-and-push-container] # check-commit needed to access its output for the skip
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-commit.outputs.is_release == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create GitHub Tags and Releases
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }} # Custom token with repo permissions
                                                     # If using the default GITHUB_TOKEN, the release commit won't trigger the docs.yml workflow,
                                                     # so docs won't update with the new version number until the next release.
