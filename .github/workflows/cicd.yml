name: Python CI/CD Pipeline

# 1. TRIGGERS
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. JOBS
jobs:
  # ==========================================
  # GATE 1: DEEP CODEQL SEMANTIC ANALYSIS
  # ==========================================
  codeql-analysis:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ==========================================
  # GATE 2: UNIT TESTING & DOC GENERATION
  # ==========================================
  test:
    needs: codeql-analysis # Waits for security scan to pass before running
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5   

    - name: Setup Python
      uses: actions/setup-python@v6 
      with:
        python-version: '3.10' 

    - name: Download dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_dev.txt

    - name: Execute pytest (with JUnit XML output)
      run: |
        python -m pytest --junitxml=pytest-report.xml
        
    - name: Upload Pytest Report on Failure
      if: failure() # Only triggers if the pytest step fails!
      uses: actions/upload-artifact@v4
      with:
        name: pytest-failure-report
        path: pytest-report.xml

    - name: Build HTML Documentation
      run: |
        pdoc ./src -o ./docs/pdocs
  
  # ==========================================
  # CD JOB: BUILD & PUSH DOCKER CONTAINER
  # ==========================================
  build-and-push-container:
    needs: test # the image only builds if tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR

    steps:
    - name: Checkout code
      uses: actions/checkout@v5 

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4 
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} # token automatically provided by GitHub

    - name: Convert owner to lowercase
      run: |
        echo "OWNER_LC=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@v6 
      with:
        context: .
        file: docker/Dockerfile.prod
        push: true
        tags: ghcr.io/${{ env.OWNER_LC }}/astralog-hpc:latest
  
  # ==========================================
  # AUTONOMOUS DOCUMENTATION DEPLOYMENT
  # ==========================================
  deploy-docs:
    needs: test # Only deploy docs if the code passes its tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # Needed to push to GitHub Pages
      id-token: write   # Needed for secure deployment

    steps:
    - name: Checkout code
      uses: actions/checkout@v5 

    - name: Setup Python
      uses: actions/setup-python@v6 
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_dev.txt
        pip install pdoc>=16.0.0

    - name: Generate HTML Documentation
      run: |
        pdoc ./src ./tests -o ./_site --logo-link https://domdegi.github.io/DeGiorgioPelorosso/index.html --logo "" 
        cp ./_site/src.html ./_site/index.html      # Adds a homepage to the generated docs
        cp -r uml _site/uml                         # Copy the UML folder into the generated site so images work

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './_site'

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4

  # ==========================================
  # MIRROR TO CINECA GITLAB
  # ==========================================
  mirror-to-gitlab:
    needs: test # Wait for tests to pass before deploying
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Required to mirror all history

      - name: Push to CINECA GitLab
        env:
          GITLAB_USERNAME: "ddegiorg" 
          GITLAB_TOKEN: ${{ secrets.CINECA_GITLAB_TOKEN }}
        run: |
          git remote add gitlab https://oauth2:$GITLAB_TOKEN@gitlab.hpc.cineca.it/$GITLAB_USERNAME/DeGiorgioPelorosso-deploy.git
          git push gitlab --all --force
          git push gitlab --tags --force