name: Python CI Pipeline

# 1. TRIGGERS
on:
  push:
    branches: [ "main" ] # Starts when you push code to the main branch
  pull_request:
    branches: [ "main" ] # Starts when you open a pull request targeting the main branch

# 2. JOBS
jobs:
  test:
    # Virtual environment with last version of Ubuntu
    runs-on: ubuntu-latest

    # 3. STEPS
    steps:
    # A. Dowload code from GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # B. Configure Python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8' 

    # C. Dowload pytest and dependencies
    - name: Download dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        # Se hai un file requirements.txt, togli il commento alla riga sotto:
        # pip install -r requirements.txt

    # D. Lancia i test!
    - name: Esegui pytest
      run: |
        pytest