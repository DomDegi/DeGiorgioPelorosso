stages:
  - deploy

deploy_to_galileo100:
  stage: deploy
  tags:
    - x86_64
    - cpu
    - docker
  image: alpine:latest
  
  script:
    - echo "Runner initialized. Executing directly on the Galileo100 CI/CD node..."
    
    # GitLab automatically clones your repo to $CI_PROJECT_DIR
    - cd $CI_PROJECT_DIR
    
    - echo "Pulling the latest container image from GHCR..."
    - singularity pull --force astralog-hpc.sif docker://ghcr.io/domdegi/astralog-hpc:latest
    
    - echo "Making job script executable and submitting to Slurm..."
    - chmod +x job.sh
    - sbatch job.sh
    
    - echo "Deployment successful! Current queue:"
    - squeue -u $CINECA_USER

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'