stages:
  - deploy

deploy_and_submit:
  stage: deploy
  tags:
    - x86_64
    - cpu
    - docker
  
  script:
    - echo "Preparing submission..."
    - cd $CI_PROJECT_DIR
    
    - echo "Pulling Singularity container..."
    - singularity pull --force astralog-hpc.sif docker://ghcr.io/domdegi/astralog-hpc:latest
    
    - echo "Submitting to SLURM queue..."
    - chmod +x job.sh
    - sbatch job.sh
    
    - echo "Checking queue status..."
    - squeue -u $CINECA_USER

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'