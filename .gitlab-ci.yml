stages:
  - deploy

deploy_to_galileo100:
  stage: deploy
  tags:
    - x86_64
    - cpu
    - docker
  image: alpine:latest
  
  before_script:
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    
    # BASE64 ENCODED:
    - echo "$CINECA_SSH_KEY" | base64 -d | tr -d '\r' | ssh-add -
    
    # DEBUG LINE: It lists the keys currently loaded.
    - ssh-add -l
    
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

  script:
    - echo "Runner initialized. Connecting to Galileo100 Login Node..."
    
    - scp -o StrictHostKeyChecking=no job.sh $CINECA_USER@login.g100.cineca.it:~/DegiorgioPelorosso/
    
    - |
      ssh -o StrictHostKeyChecking=no $CINECA_USER@login.g100.cineca.it << 'EOF'
        cd ~/DegiorgioPelorosso
        
        echo "Pulling the latest container image from GHCR..."
        singularity pull --force astralog-hpc.sif docker://ghcr.io/domdegi/astralog-hpc:latest
        
        echo "Making job script executable and submitting to Slurm..."
        chmod +x job.sh
        sbatch job.sh
        
        echo "Deployment successful! Current queue:"
        squeue -u $USER
      EOF

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'