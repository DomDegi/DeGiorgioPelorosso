stages:
  - build_container
  - publish

build_apptainer:
  stage: build_container
  image:
    name: kaczmarj/apptainer
    entrypoint: [""]
  tags:
    - x86_64
    - cpu
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Pulling Docker image from GHCR and converting to Singularity .sif..."
    - mkdir -p build

    # We use 'pull' directly on the GHCR docker image instead of 'build' with a .def file
    # This automatically converts the Docker layers into a flat Singularity image
    - apptainer pull --force build/astralog-hpc.sif docker://ghcr.io/domdegi/astralog-hpc:latest
  artifacts:
    paths:
      - build/astralog-hpc.sif
    expire_in: 1 hour

publish_sif:
  stage: publish
  image: alpine:latest
  tags:
    - x86_64
    - cpu
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  dependencies:
    - build_apptainer
  before_script:
    # Install curl and jq (required for JSON parsing) since Alpine doesn't have them by default
    - apk add --no-cache curl jq
  script:
    - echo "Cleaning up old packages to free up quota..."
    - |
      # Fetch all packages named 'astralog-sif' sorted by creation date (newest first)
      curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=astralog-sif&order_by=created_at&sort=desc" > packages.json

      # Extract package IDs, ignore the 'latest' tag, and skip the first 3 (which we want to keep)
      IDS_TO_DELETE=$(jq -r '.[] | select(.version != "latest") | .id' packages.json | tail -n +4)

      if [ -z "$IDS_TO_DELETE" ]; then
        echo "No old packages found to delete. Proceeding..."
      else
        for ID in $IDS_TO_DELETE; do
          echo "Deleting old package ID: $ID..."
          curl --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
               "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/$ID"
        done
        echo "Cleanup complete."
      fi

    - echo "Uploading .sif file to GitLab Package Registry..."
    - VERSION="${CI_COMMIT_SHORT_SHA}"

    - test -s build/astralog-hpc.sif || (echo "ERROR: .sif is empty or missing" && exit 1)

    # Uploads the specific commit version
    - |
      curl --fail \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file build/astralog-hpc.sif \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/astralog-sif/${VERSION}/astralog-hpc.sif"

    - echo "Updating the 'latest' tag..."

    # Uploads the 'latest' version to easily overwrite the old one
    - |
      curl --fail \
           --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file build/astralog-hpc.sif \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/astralog-sif/latest/astralog-hpc.sif"
