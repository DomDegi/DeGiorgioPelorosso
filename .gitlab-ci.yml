stages:
  - deploy

deploy_and_submit:
  stage: deploy
  tags:
    - x86_64
    - cpu
    - docker
  image: alpine:latest
  
  before_script:
    # Install the required SSH clients inside the runner container
    - apk add --no-cache openssh-client bash
    
    # Initialize the SSH agent and add your private key
    - eval $(ssh-agent -s)
    - echo "$CINECA_SSH_KEY" | base64 -d | tr -d '\r' | ssh-add -
    
    # Create the runner's local SSH directory and scan Galileo100 to prevent authenticity prompts
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H login.g100.cineca.it >> ~/.ssh/known_hosts

  script:
    - echo "Connecting to Galileo100 login node..."
    
    # Ensure the inputs directory exists in your root home folder
    - ssh $CINECA_USER@login.g100.cineca.it "mkdir -p ~/inputs"
    
    # Copy the execution scripts directly to your home directory (~)
    - scp job.sh submit.sh $CINECA_USER@login.g100.cineca.it:~/
    
    # If you have updated json/yaml configuration files in your repository, sync them to ~/inputs/
    - scp inputs/config/*.json inputs/config/*.yaml $CINECA_USER@login.g100.cineca.it:~/inputs/ || true
    
    # Open a secure shell session to execute the deployment script natively on the login node
    - |
      ssh $CINECA_USER@login.g100.cineca.it << 'EOF'
        cd ~
        chmod +x submit.sh job.sh
        
        # Execute the update and queue submission script
        ./submit.sh
      EOF

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'